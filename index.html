<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, World! | GitHub Pages</title>
    <!-- Tailwind CSS via CDN for zero-config styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Subtle animated background glow */
        .glow {
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, rgba(15, 23, 42, 0) 70%);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-6 relative overflow-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Ambient Background Glow -->
    <div class="glow absolute inset-0 pointer-events-none"></div>

    <!-- Main Card -->
    <main class="relative z-10 max-w-lg w-full bg-slate-900/70 backdrop-blur-xl border border-slate-800/80 rounded-2xl p-8 md:p-10 shadow-2xl">
        
        <!-- Status Badge -->
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-mono mb-6">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
            </span>
            Status: Deployed
        </div>

        <!-- Heading -->
        <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-white mb-4">
            Hovno, <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-cyan-400">World!</span>
        </h1>

        <!-- Description -->
        <p class="text-slate-400 text-base md:text-lg leading-relaxed mb-8">
            This static site is successfully hosted and served via <span class="text-slate-200 font-medium">GitHub Pages</span>. Ready for testing, prototyping, and deployment workflows.
        </p>

        <!-- Mock Terminal / Info Box -->
        <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-4 mb-8 font-mono text-xs text-slate-400 space-y-1.5">
            <div class="flex items-center gap-1.5 pb-2 mb-2 border-b border-slate-800/80">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500/80"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></span>
                <span class="ml-2 text-slate-500">deployment-info</span>
            </div>
            <p><span class="text-indigo-400">~</span> Environment: <span class="text-slate-200">Production / Test</span></p>
            <p><span class="text-indigo-400">~</span> Host: <span class="text-slate-200" id="hostname">github.io</span></p>
            <p><span class="text-indigo-400">~</span> Loaded at: <span class="text-slate-200" id="timestamp"></span></p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap items-center gap-3">
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" 
               class="inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg bg-white text-slate-950 font-semibold text-sm hover:bg-slate-200 transition-colors">
                podme na druhy
            </a>
            <button onclick="window.location.reload()" 
                    class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-slate-800 text-slate-200 font-medium text-sm border border-slate-700 hover:bg-slate-700 transition-colors cursor-pointer">
                Refresh Page
            </button>
        </div>

    </main>

    <!-- Tiny script to dynamically populate host & load time -->
    <script>
        document.getElementById('hostname').textContent = window.location.hostname || 'localhost';
        document.getElementById('timestamp').textContent = new Date
