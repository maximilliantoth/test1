<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content" />
  <title>POINTLESS // ČO NAJMENEJ ĽUDÍ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #070b14;
      --panel-bg: rgba(11, 18, 33, 0.94);
      --panel-border: #00e5ff;
      --accent-gold: #ffd700;
      --accent-pink: #ff2a85;
      --accent-green: #00ff88;
      --text-main: #f0f6fc;
      --text-muted: #8b9bb4;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Space Grotesk', sans-serif;
    }

    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      z-index: 1;
    }

    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.16) 50%);
      background-size: 100% 4px;
    }

    .pixel-font {
      font-family: 'Press Start 2P', monospace;
    }

    #uiLayer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      pointer-events: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }

    .hud-badge {
      background: var(--panel-bg);
      border: 3px solid var(--panel-border);
      box-shadow: 0 4px 0 #020408, inset 0 0 0 2px #0f2942;
      padding: 8px 12px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .hud-btn {
      cursor: pointer;
      transition: transform 0.08s;
    }
    .hud-btn:active {
      transform: translateY(2px);
    }

    .center-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding: 10px;
    }

    .pixel-card {
      pointer-events: auto;
      width: 100%;
      max-width: 560px;
      background: var(--panel-bg);
      border: 4px solid var(--panel-border);
      box-shadow: 0 0 0 4px #040812, 0 12px 30px rgba(0, 0, 0, 0.75);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: popIn 0.2s ease-out;
    }

    @keyframes popIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .title-logo {
      text-align: center;
      color: var(--accent-gold);
      font-size: clamp(20px, 4.5vw, 30px);
      text-shadow: 3px 3px 0 #b84a00, 6px 6px 0 #000;
      margin: 4px 0;
      line-height: 1.3;
    }

    .subtitle {
      text-align: center;
      color: #7dd3fc;
      font-size: 11px;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .pixel-input {
      width: 100%;
      background: #050a14;
      border: 3px solid #2b4c7e;
      color: #fff;
      padding: 12px 14px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      user-select: text;
    }

    .pixel-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.25);
    }

    .pixel-btn {
      width: 100%;
      background: #0d6efd;
      border: 3px solid #6ea8fe;
      box-shadow: 0 4px 0 #052c65;
      color: #fff;
      padding: 13px 16px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      transition: transform 0.08s;
      line-height: 1.4;
    }

    .pixel-btn:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #052c65;
    }

    .pixel-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-green {
      background: #0a7d4a;
      border-color: #3dd598;
      box-shadow: 0 4px 0 #033b22;
    }

    .btn-gold {
      background: #b58500;
      border-color: #ffe066;
      box-shadow: 0 4px 0 #594100;
      color: #fff;
    }

    .btn-pink {
      background: #b0185a;
      border-color: #ff70a6;
      box-shadow: 0 4px 0 #4d0826;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .question-box {
      background: #081529;
      border: 2px solid #1e4976;
      padding: 14px;
      text-align: center;
    }

    .q-category {
      color: #38bdf8;
      font-size: 10px;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .q-text {
      font-size: clamp(16px, 3.2vw, 21px);
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
    }

    .timer-track {
      width: 100%;
      height: 8px;
      background: #132238;
      border: 2px solid #26436b;
      overflow: hidden;
    }

    .timer-fill {
      height
